<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <form>
    <fieldset><legend>1.Demographic Information</legend>
    <label>Full Name</label><br>
    <input type="text"  placeholder="Enter your full name" required><br>
    <label>Date of Birth</label><br>
    <input type="date"  required><br>
    <label>Gender</label>
    <div>
    <input type="radio" id="Male" name="Gender" value="Male">
    <label for="Male">Male</label>
    </div>

    <div>
    <input type="radio" id="Female" name="Gender" value="Female">
    <label for="Female">Female</label>
    </div>
    
    <div>
    <input type="radio" id="Non-binary" name="Gender" value="Non-binary">
    <label for="Non-binary">Non-binary</label>
    </div>

    <div>
    <input type="radio" id="Prefer not to say" name="Gender" value="Prefer not to say">
    <label for="Prefer not to say">Prefer not to say</label>
    </div>

     <label>Email Address </label><br>
    <input type="text"  placeholder="example@gmail.com" required><br>
    <label>Phone Number</label><br>
    <input type="number" name="" value="Phone number" required><br>
    <label>Residential Address</label><br>
    <input type="number" name="" value="Phone number" required><br>
     <label>Nationality</label><br>
     <select id="nationality" name="nationality" aria-placeholder="--Nationality--"><br>
        <option value="Rwandan" >Rwandan</option>
        <option value="Ugandan" >Uganadan</option>
        <option value="Kenyan" >Kenyan</option>
     </select><br>
    <label>City </label><br>
    <input type="text"  placeholder="Enter your city" required><br>
    <label>Postal Code </label><br>
    <input type="text"  placeholder="Enter Postal code" required><br>
    <label>Upload Passport Photo </label><br>
    <input type="file"><br>
    <label>Preferred Contact Method </label><br>
    <div>
    <input type="checkbox" id="Email" name="contact" value="Email">
    <label for="Email">Email</label>
    </div>

    <div>
    <input type="checkbox" id="Phone" name="contact" value="Phone">
    <label for="Phone">Phone</label>
    </div>

    <div>
    <input type="checkbox" id="SMS" name="contact" value="SMS">
    <label for="SMS">SMS</label>
    </div>

    <div>
    <input type="checkbox" id="WhatsApp" name="contact" value="WhatsApp">
    <label for="WhatsApp">WhatsApp</label>
    </div>
     </fieldset>
  </form>  
  </form>  

  </form>  
</body>
</html>
